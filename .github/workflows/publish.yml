name: CI / Release & Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'  # تشغيل الـ Action تلقائياً عند رفع Tag مثل v1.0.0

jobs:
  release:
    runs-on: ubuntu-latest
    permissions: 
      contents: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Project (If defined)
        run: npm run build --if-present

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Release v1.0.{0}', github.run_number) }}
          body: "Commit: ${{ github.sha }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
